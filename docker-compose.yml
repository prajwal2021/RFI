version: "3.8"

services:
  db:
    image: postgres:16
    container_name: rfi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rfi_user
      POSTGRES_PASSWORD: rfi_password
      POSTGRES_DB: rfi_db
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: rfi-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://rfi_user:rfi_password@db:5432/rfi_db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
    depends_on:
      - db

  backup:
    image: postgres:16
    container_name: rfi-backup
    restart: unless-stopped
    entrypoint: ["bash", "/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: rfi_user
      PGPASSWORD: rfi_password
      PGDATABASE: rfi_db
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: rfi-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/rfi-api
    depends_on:
      - backend

volumes:
  pgdata:
