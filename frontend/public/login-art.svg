<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 1330" width="1260" height="1330">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#1a1a1a"/>
<stop offset="0.55" stop-color="#2b0a0a"/>
<stop offset="1" stop-color="#cc0000"/>
</linearGradient>
<radialGradient id="glow" cx="0.85" cy="0.9" r="0.7">
<stop offset="0" stop-color="#ff3b30" stop-opacity="0.55"/>
<stop offset="1" stop-color="#ff3b30" stop-opacity="0"/>
</radialGradient>
<pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
<path d="M60 0H0V60" fill="none" stroke="#fff" stroke-opacity="0.05" stroke-width="1"/>
</pattern>
</defs>
<rect width="1260" height="1330" fill="url(#bg)"/>
<rect width="1260" height="1330" fill="url(#grid)"/>
<rect width="1260" height="1330" fill="url(#glow)"/>

  <!-- decorative rings -->
<g fill="none" stroke="#fff" stroke-opacity="0.08">
<circle cx="1040" cy="260" r="180"/>
<circle cx="1040" cy="260" r="260"/>
<circle cx="1040" cy="260" r="340"/>
</g>

  <!-- floating form cards -->
<g transform="translate(700 150) rotate(6)">
<rect width="380" height="250" rx="22" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.25"/>
<rect x="28" y="30" width="150" height="14" rx="7" fill="#fff" fill-opacity="0.7"/>
<rect x="28" y="70" width="324" height="34" rx="10" fill="#fff" fill-opacity="0.15"/>
<rect x="28" y="120" width="324" height="34" rx="10" fill="#fff" fill-opacity="0.15"/>
<rect x="28" y="180" width="110" height="38" rx="12" fill="#cc0000"/>
</g>
<g transform="translate(780 450) rotate(-4)">
<rect width="360" height="190" rx="22" fill="#fff" fill-opacity="0.10" stroke="#fff" stroke-opacity="0.25"/>
<text x="28" y="48" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#fff" fill-opacity="0.8">Responses this week</text>
<g fill="#fff" fill-opacity="0.75">
<rect x="32"  y="110" width="30" height="50" rx="6"/>
<rect x="82"  y="90"  width="30" height="70" rx="6"/>
<rect x="132" y="120" width="30" height="40" rx="6"/>
<rect x="182" y="70"  width="30" height="90" rx="6"/>
<rect x="232" y="95"  width="30" height="65" rx="6"/>
<rect x="282" y="60"  width="30" height="100" rx="6" fill="#ff5a4f"/>
</g>
</g>

  <!-- logo mark: abstract double-T -->
<g transform="translate(70 180)">
<rect width="54" height="54" rx="14" fill="#cc0000"/>
<path d="M12 16h30M27 16v24M16 40h22" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none"/>
<text x="72" y="26" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#fff" letter-spacing="1">TTU Online</text>
<text x="72" y="50" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" fill-opacity="0.75" letter-spacing="3">RFI SYSTEM</text>
</g>

  <!-- headline -->
<g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#fff">
<text x="70" y="690" font-size="46" font-weight="700">Collect, track and act on</text>
<text x="70" y="750" font-size="46" font-weight="700">every request for information.</text>
<text x="70" y="800" font-size="22" fill-opacity="0.8">Built for Texas Tech University Online teams.</text>
</g>

  <!-- feature rows -->
<g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#fff" fill-opacity="0.92">
<g transform="translate(70 860)">
<rect width="40" height="40" rx="10" fill="#fff" fill-opacity="0.15"/>
<path d="M12 14h16M12 20h16M12 26h10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<text x="62" y="28">Organise forms across TTU Online departments</text>
</g>
<g transform="translate(70 928)">
<rect width="40" height="40" rx="10" fill="#fff" fill-opacity="0.15"/>
<path d="M12 28V18M20 28V12M28 28V22" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<text x="62" y="28">Track responses with live activity charts</text>
</g>
<g transform="translate(70 996)">
<rect width="40" height="40" rx="10" fill="#fff" fill-opacity="0.15"/>
<path d="M20 10l9 4v7c0 6-4 9-9 11-5-2-9-5-9-11v-7z" stroke="#fff" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
<text x="62" y="28">Role-based access for your whole team</text>
</g>
</g>

  <text x="70" y="1290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#fff" fill-opacity="0.6">© 2026 TTU Online · RFI System</text>
</svg>
